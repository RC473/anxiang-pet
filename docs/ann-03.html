    <p style="color:var(--ink-dim);font-size:12.5px;">发布日期：09-25</p>
    <p>12月将联合社区居委会，在安巷路社区广场开展流浪动物免费基础体检活动，欢迎附近热心投喂人士届时带猫猫狗狗前来检查。具体时间另行通知。</p>
    <p style="color:var(--ink-dim);font-size:13px;">往年义诊都会遇到几只从惠民里那边过来的老面孔，那片地方拆了好几年了，猫狗倒是一直没断过，年年都有新面孔混在老面孔里，也说不清是不是同一批。</p>
