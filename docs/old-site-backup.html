    <h2>惠民里诊所公告</h2>
    <p style="font-size:13.5px;color:var(--ink-dim);">发布日期：2018-03（旧站）</p>
    <p>各位老街坊：因惠民里片区旧城改造，本诊所将于本月底搬迁至安巷路新址。感谢大家这些年的信任，新址距离不远，欢迎继续带家里的猫猫狗狗来看诊。</p>
    <p>搬迁前这几天，陆续有街坊来问，自己家已经腾空的房子，猫还愿不愿意跟着一起搬。苏医生的建议是：先接到新家适应几天，笼子里放一件旧衣服，它认味道认得比认地址准。</p>
    <p style="color:var(--warn);font-size:13px;">— 页面最后更新于搬迁前三天，之后就再没人维护过这个旧站了。 —</p>
