  <h1>换了一个本子</h1>
  <p>新本子第一页贴了一样东西——一个磨得发亮的旧狗牌，链子已经锈断了，上面刻的字被苏医生用潦草的字迹在旁边重新誊抄了一遍，但顺序打乱了，像是故意排成了某种三行交叠的样子：</p>
  <div class="cipher">xgninqaau</div>
  <p>誊抄旁边写着：「捡到它的时候，主人那户已经不在原来的地方了。问了好几个老住户，都说没养过这样一只。」</p>
  <p>本子从这一页往后，字迹突然变得很少，大段大段的都是空白。最后几页，只剩下这一句。</p>
