  <h1>一张贴在本子里的小纸条</h1>
  <p>本子中间夹了一张小纸条，不是苏医生的笔迹，字很小，像是怕被谁看到似的写得又快又挤。纸条上画的不是字，是一串点和划：</p>
  <div class="cipher">. .-. -... .. .- ---</div>
  <p>纸条背面只有一句：「以后进出都认这个，别的编号不用管。」</p>
  <p>纸条下面压着半张就诊单，边角已经发黄了。</p>
