  <h1>X光机的错误日志</h1>
  <p>这几页夹着几张打印出来的错误日志，是当时那台老X光机偶尔卡住时自动吐出来的，工程师检修时说是系统乱码，没当回事，苏医生却把它剪下来贴在了本子里：</p>
  <div class="cipher">78 69 61 6e 67 7a 69</div>
  <p>日志下面写着：「机器坏的那几次，都是同一个地方拍出来的片子，位置对得上巷子的那个拐角。」</p>
  <p>这句话被划掉又重新描了一遍，看得出写的时候手不太稳。</p>
